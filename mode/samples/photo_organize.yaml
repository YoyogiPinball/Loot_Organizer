# ========================================
# 📸 写真整理サンプル（高度な例）
# ========================================
#
# 【このサンプルについて】
# 画像ファイルを解像度、アスペクト比、ファイルサイズ、日付で
# 自動的に振り分ける高度な設定例です。
#
# 【使い方】
# 1. このファイルを mode/my_photos.yaml にコピー
# 2. target_directory を自分の写真フォルダに変更
# 3. ルールの条件や振り分け先を調整
#
# 【高度な機能の例】
# - 解像度フィルタリング（例: 4K以上、1080p以下）
# - アスペクト比フィルタリング（縦長、横長、正方形）
# - ファイルサイズフィルタリング（例: 10MB以上）
# - 日付フィルタリング（例: 2024年以降）
#
# ========================================

meta:
  name: "写真整理（高度）"
  icon: "📸"
  mode: "Sort"
  description: "解像度・アスペクト比・サイズ・日付で写真を自動振り分け"

# =====================================
# 基本設定
# =====================================
settings:
  # 処理対象のディレクトリ（単一または複数指定可能）
  target_directory: "C:\\Users\\YOUR_USERNAME\\Pictures\\Unsorted"

  # 複数ディレクトリを指定する場合はリスト形式で記述
  # target_directory:
  #   - "C:\\Users\\YOUR_USERNAME\\Pictures\\Unsorted"
  #   - "D:\\Photos\\ToSort"

  # ログを記録するか
  enable_logging: true

  # 実行前に確認プロンプトを表示するか
  confirm_before_execute: true

  # ドライラン（プレビューのみ）をデフォルトで有効化
  dry_run_default: false

  # プレビュー表示設定
  preview:
    mode: "both"      # 先頭と末尾を両方表示
    count: 5          # 各5件ずつ表示

  # ログ設定
  logging:
    log_success: true
    log_directory: "logs"

# =====================================
# 移動ルール（高度な例）
# =====================================
# 【重要】上から順に評価され、最初にマッチしたルールのみが適用されます
#
# 各フィルタは AND条件（すべて満たす必要あり）
# OR条件が必要な場合は、ルールを複数作成してください
#
move_rules:
  # -------------------------------
  # 解像度ベースの振り分け
  # -------------------------------
  # 4K以上の高解像度画像
  - pattern: "*.jpg"
    dest: "C:\\Users\\username\\Pictures\\HighRes\\4K_Plus"
    description: "4K以上のJPG画像"
    enabled: true
    filters:
      resolution:
        min_width: 3840       # 4K幅以上
        min_height: 2160      # 4K高さ以上

  # フルHD以上の画像
  - pattern: "*.png"
    dest: "C:\\Users\\username\\Pictures\\HighRes\\FullHD_Plus"
    description: "フルHD以上のPNG画像"
    enabled: true
    filters:
      resolution:
        min_width: 1920       # 1920x1080以上
        min_height: 1080

  # 低解像度画像（サムネイルなど）
  - pattern: "*.*"
    dest: "C:\\Users\\username\\Pictures\\LowRes\\Thumbnails"
    description: "低解像度画像（サムネイル）"
    enabled: true
    filters:
      resolution:
        max_width: 500        # 横500px以下
        max_height: 500       # 縦500px以下

  # -------------------------------
  # アスペクト比ベースの振り分け
  # -------------------------------
  # 縦長画像（スマホスクショなど）
  - pattern: "*.png"
    dest: "C:\\Users\\username\\Pictures\\Vertical\\Screenshots"
    description: "縦長画像（スクショ等）"
    enabled: true
    filters:
      aspect_ratio:
        vertical_min: 1.2     # 縦横比 1.2:1 以上（縦長）

  # 横長画像（風景写真など）
  - pattern: "*.jpg"
    dest: "C:\\Users\\username\\Pictures\\Horizontal\\Landscape"
    description: "横長画像（風景等）"
    enabled: true
    filters:
      aspect_ratio:
        horizontal_max: 0.8   # 縦横比 0.8:1 以下（横長）

  # 正方形画像（SNSアイコンなど）
  - pattern: "*.*"
    dest: "C:\\Users\\username\\Pictures\\Square\\Icons"
    description: "正方形画像（アイコン等）"
    enabled: true
    filters:
      aspect_ratio:
        square_tolerance: 0.05  # 正方形判定の許容範囲（±5%）

  # -------------------------------
  # ファイルサイズベースの振り分け
  # -------------------------------
  # 大容量ファイル（10MB以上）
  - pattern: "*.*"
    dest: "C:\\Users\\username\\Pictures\\Large\\10MB_Plus"
    description: "大容量画像（10MB以上）"
    enabled: true
    filters:
      size:
        min: "10MB"           # 文字列表記（KB/MB/GB対応）

  # 中容量ファイル（1MB～10MB）
  - pattern: "*.*"
    dest: "C:\\Users\\username\\Pictures\\Medium\\1-10MB"
    description: "中容量画像（1-10MB）"
    enabled: true
    filters:
      size:
        min: "1MB"
        max: "10MB"

  # 小容量ファイル（1MB未満）
  - pattern: "*.*"
    dest: "C:\\Users\\username\\Pictures\\Small\\Under1MB"
    description: "小容量画像（1MB未満）"
    enabled: true
    filters:
      size:
        max: 1048576          # 数値表記（バイト単位）

  # -------------------------------
  # 日付ベースの振り分け
  # -------------------------------
  # 2024年以降の新しいファイル
  - pattern: "*.*"
    dest: "C:\\Users\\username\\Pictures\\Recent\\2024_Plus"
    description: "2024年以降のファイル"
    enabled: true
    filters:
      date:
        after: "2024-01-01"   # YYYY-MM-DD形式

  # 2023年のファイル
  - pattern: "*.*"
    dest: "C:\\Users\\username\\Pictures\\Archive\\2023"
    description: "2023年のファイル"
    enabled: true
    filters:
      date:
        after: "2023-01-01"
        before: "2024-01-01"

  # 古いファイル（2023年より前）
  - pattern: "*.*"
    dest: "C:\\Users\\username\\Pictures\\Archive\\Old"
    description: "2023年より前のファイル"
    enabled: true
    filters:
      date:
        before: "2023-01-01"

  # -------------------------------
  # 複合条件の例
  # -------------------------------
  # 高解像度 かつ 大容量 の画像
  - pattern: "*.jpg"
    dest: "C:\\Users\\username\\Pictures\\Premium\\HighRes_Large"
    description: "高解像度＋大容量のJPG画像"
    enabled: true
    filters:
      resolution:
        min_width: 3840
        min_height: 2160
      size:
        min: "5MB"

  # 縦長 かつ 高解像度 の画像（スマホスクショ等）
  - pattern: "*.png"
    dest: "C:\\Users\\username\\Pictures\\Mobile\\HighRes_Screenshots"
    description: "高解像度の縦長PNG（スマホスクショ）"
    enabled: true
    filters:
      resolution:
        min_width: 1080
        min_height: 1920
      aspect_ratio:
        vertical_min: 1.5

  # -------------------------------
  # デフォルト（条件なし）
  # -------------------------------
  # どのルールにもマッチしなかった画像
  - pattern: "*.*"
    dest: "C:\\Users\\username\\Pictures\\Others"
    description: "その他の画像"
    enabled: true

# =====================================
# 除外パターン
# =====================================
exclusions:
  exact_names:
    - "desktop.ini"
    - "Thumbs.db"
    - ".DS_Store"

  patterns:
    - "*.tmp"
    - "*.bak"

# =====================================
# 補足説明
# =====================================
# 【解像度フィルタ】
# - min_width: 最小幅（ピクセル）
# - min_height: 最小高さ（ピクセル）
# - max_width: 最大幅（ピクセル）
# - max_height: 最大高さ（ピクセル）
#
# 【アスペクト比フィルタ】
# - vertical_min: 縦長の最小比率（例: 1.2 = 縦が横の1.2倍以上）
# - horizontal_max: 横長の最大比率（例: 0.8 = 縦が横の0.8倍以下）
# - square_tolerance: 正方形判定の許容範囲（例: 0.05 = ±5%）
#
# 【サイズフィルタ】
# - min: 最小サイズ（"10MB" または 10485760 のようなバイト数値）
# - max: 最大サイズ（"10MB" または 10485760 のようなバイト数値）
# - 単位: KB, MB, GB が使用可能
#
# 【日付フィルタ】
# - after: この日付以降（YYYY-MM-DD形式）
# - before: この日付より前（YYYY-MM-DD形式）
# - 注: ファイルの更新日時（mtime）を基準に判定

